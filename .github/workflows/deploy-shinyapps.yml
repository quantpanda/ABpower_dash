name: Deploy to shinyapps.io

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# never run two deploys at once; a newer push waits for the current one
concurrency:
  group: deploy-shinyapps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - uses: r-lib/actions/setup-r@v2
      with:
        use-public-rspm: true

    # installs binaries plus system libraries (GDAL/GEOS/PROJ for sf);
    # cpp11 and progress are build-only deps that rsconnect's renv snapshot still requires
    - uses: r-lib/actions/setup-r-dependencies@v2
      with:
        packages: |
          shiny
          shinythemes
          tidyverse
          readxl
          maps
          sf
          rvest
          leaflet
          plotly
          rsconnect
          cpp11
          progress

    - name: Smoke test (live AESO scrape + map render)
      run: Rscript tests/smoke_test.R

    # rsconnect copies install metadata into the manifest, and shinyapps.io only
    # understands Source=CRAN for these packages:
    # - P3M binaries record "Repository: RSPM" -> Source=RSPM
    #   ("Unsupported url scheme: RSPM/src/contrib/...")
    # - pak "any::pkg" refs record "RemoteType: any" -> Source=any
    # Retag both as plain CRAN installs (which they are).
    - name: Tag installed packages as CRAN
      run: |
        Rscript -e 'cat(.libPaths(), sep = "\n")' | while read -r lib; do
          grep -l -E '^(Repository: RSPM|RemoteType: any)$' "$lib"/*/DESCRIPTION 2>/dev/null \
            | xargs -r sed -i -E \
                -e 's/^Repository: RSPM$/Repository: CRAN/' \
                -e 's/^RemoteType: any$/RemoteType: standard/' \
                -e 's/^(RemotePkgRef|RemoteRef): any::/\1: /'
        done

    - name: Check manifest sources
      run: |
        Rscript -e '
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          rsconnect::writeManifest(appFiles = c("global.R", "server.R", "ui.R"), quiet = TRUE)
          pkgs <- jsonlite::read_json("manifest.json")$packages
          unlink("manifest.json")
          src <- vapply(pkgs, function(p) if (is.null(p$Source)) NA_character_ else p$Source, "")
          bad <- src[is.na(src) | src != "CRAN"]
          if (length(bad)) stop("Non-CRAN sources in manifest: ", paste(names(bad), bad, sep = "=", collapse = ", "))
          message("All ", length(src), " packages resolve to Source=CRAN")'

    - name: Deploy
      env:
        SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
        SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
      run: |
        Rscript -e '
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          rsconnect::setAccountInfo(name = "ohaley",
                                    token = Sys.getenv("SHINYAPPS_TOKEN"),
                                    secret = Sys.getenv("SHINYAPPS_SECRET"))
          rsconnect::deployApp(
            appName = "ab_power",
            appId = 11258662,
            appFiles = c("global.R", "server.R", "ui.R",
                         "CSD Generation (Hourly) - 2024-01 2.csv",
                         list.files("AESO-Planning-Areas-2020-06-23", full.names = TRUE)),
            forceUpdate = TRUE,
            launch.browser = FALSE
          )'
